name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Product gates, type-check, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Dummy value: no test touches a live DB, but turbo.json lists
      # DATABASE_URL in globalEnv — pin it so the turbo cache key is stable.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from the root package.json "packageManager" field —
      # specifying it here too makes pnpm/action-setup fail with
      # "Multiple versions of pnpm specified".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/web imports @tasknebula/mcp-server via its exports map, which
      # points at dist/ — build it first or type-check fails on a fresh clone.
      - name: Build workspace packages consumed via dist
        run: pnpm --filter @tasknebula/mcp-server build

      - name: Verify web i18n catalog parity
        run: node scripts/i18n-check.mjs

      - name: Verify open-source repository hygiene
        run: pnpm hygiene:check

      - name: Verify web UI design contract
        run: pnpm ui:check

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        # --forceExit: a leaked handle (timer/connection) should fail fast,
        # not hang the job until the 30-minute timeout. Invoke turbo directly
        # so the flag deterministically reaches each package's jest.
        run: pnpm exec turbo run test -- --forceExit

  mobile-native:
    name: Mobile native self-host verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from the root package.json "packageManager" field —
      # specifying it here too makes pnpm/action-setup fail with
      # "Multiple versions of pnpm specified".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify mobile i18n catalogs
        run: pnpm --filter @tasknebula/mobile i18n:check

      - name: Verify mobile OpenAPI sync
        run: pnpm --filter @tasknebula/mobile openapi:check

      - name: Verify mobile design parity
        run: pnpm --filter @tasknebula/mobile design:verify

      - name: Verify bare native project
        run: pnpm --filter @tasknebula/mobile native:verify

      - name: Verify iOS release JS bundle
        run: pnpm --filter @tasknebula/mobile ios:verify-bundle

      - name: Verify Android build and release signing
        run: pnpm --filter @tasknebula/mobile android:verify-build
